name: Redraw profile cards

on:
  schedule:
    - cron: "23 3 * * *"  # every day, 07:23 in Dubai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.toml"
      - "generator/**"
      - "assets/fonts/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r generator/requirements.txt
      - name: Draw the cards
        run: python generator/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit them if anything changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "No card changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redraw profile cards"
          git pull --rebase
          git push
