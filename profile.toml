# Each project becomes assets/project-<repo>.svg and project-<repo>-mobile.svg.
# README.md links them, so change both together.
#
# `flow` is the signal path drawn on the card, three to five stages; `tap` is
# an optional branch off the stage numbered `from` (counting from 0). Labels
# and notes have to fit their blocks, and blurbs four lines; the build stops
# and says which one if not.
[[projects]]
repo = "nurdle-dna"
title = "NurdleDNA"
tag = "Embedded + AI"
context = "ECTE 250 · team of 4 · system architect"
blurb = "Inline water monitor that catches nurdle microplastics. A Jetson Nano runs YOLOv8n on the flow cell's camera, an Arduino state machine closes the valve, and every event lands on a live Firebase dashboard."
flow = [
  { part = "FLOW CELL", note = "camera, UV LED" },
  { part = "JETSON NANO", note = "YOLOv8n vision" },
  { part = "ARDUINO UNO", note = "5-state FSM" },
  { part = "PINCH VALVE", note = "isolates flow" },
]
tap = { from = 1, part = "FIREBASE", note = "live dashboard" }

