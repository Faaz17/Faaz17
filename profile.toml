# Everything the cards say that does not come from GitHub's API.
# Change it, push, and the Action redraws the cards within a minute or two.

login = "Faaz17"

[hero]
eyebrow = "Computer Engineering · University of Wollongong in Dubai"
eyebrow_mobile = ["Computer Engineering", "UOWD · Dubai"]  # the phone card has less room
name = "Faaz Ali Sayyed"
# The current role sits beside the board's status LED.
role = "President, Engineers Australia Student Society at UOWD"
term = "2026/27"
chip = "FAAZ17"
# Each focus area is drawn as a net label routed back to the chip. Three fit.
nets = [
  { net = "EDGE_AI", detail = "Jetson · CUDA · OpenCV" },
  { net = "EMBEDDED", detail = "Arduino · sensors · state machines" },
  { net = "ROBOTICS", detail = "Webots · autonomy · VLM perception" },
]

[languages]
rows = 6
# Left out of the meter: a classmate's project hosted here, the prototype that
# backtestingfinal replaced (it would count the same code twice), and CSCI291,
# which GitHub reads as mostly SWIG and assembly.
exclude_repos = ["muskaannn-final-webot", "backtesting-platform", "CSCI291"]
# Markup and build files are not what anyone means by "languages I write".
exclude_languages = ["HTML", "CSS", "SCSS", "Makefile", "Dockerfile", "Batchfile"]

[toolchain]
# Twelve fit on the card: three to a row on desktop, two on a phone.
parts = [
  { part = "PYTHON", role = "LANGUAGE" },
  { part = "C / C++", role = "LANGUAGE" },
  { part = "JAVA", role = "LANGUAGE" },
  { part = "TYPESCRIPT", role = "LANGUAGE" },
  { part = "CUDA", role = "GPU COMPUTE" },
  { part = "JETSON", role = "EDGE AI" },
  { part = "OPENCV", role = "VISION" },
  { part = "ARDUINO", role = "MICROCONTROLLER" },
  { part = "WEBOTS", role = "ROBOT SIM" },
  { part = "NEXT.JS", role = "WEB APPS" },
  { part = "UNITY", role = "XR AND 3D" },
  { part = "MATLAB", role = "NUMERICS" },
]

# Each project becomes assets/project-<repo>.svg and project-<repo>-mobile.svg.
# README.md links them, so change both together.
#
# `flow` is the signal path drawn on the card, three to five stages; `tap` is
# an optional branch off the stage numbered `from` (counting from 0). Labels
# and notes have to fit their blocks, and blurbs four lines; the build stops
# and says which one if not.
[[projects]]
repo = "nurdle-dna"
title = "NurdleDNA"
tag = "Embedded + AI"
context = "ECTE 250 · team of 4 · system architect"
blurb = "Inline water monitor that catches nurdle microplastics. A Jetson Nano runs YOLOv8n on the flow cell's camera, an Arduino state machine closes the valve, and every event lands on a live Firebase dashboard."
flow = [
  { part = "FLOW CELL", note = "camera, UV LED" },
  { part = "JETSON NANO", note = "YOLOv8n vision" },
  { part = "ARDUINO UNO", note = "5-state FSM" },
  { part = "PINCH VALVE", note = "isolates flow" },
]
tap = { from = 1, part = "FIREBASE", note = "live dashboard" }

[[projects]]
repo = "ResQ"
title = "ResQ"
tag = "Robotics"
context = "HWT Hackathon · Python and Next.js"
blurb = "Rescue robot in Webots that patrols on its own, steers around obstacles on eight sonars and spots victims with Gemini 2.5 Flash. A Next.js mission control shows the camera and detections live."
flow = [
  { part = "WEBOTS", note = "Pioneer 3-DX" },
  { part = "CONTROLLER", note = "4-state nav" },
  { part = "GEMINI", note = "finds victims" },
  { part = "DASHBOARD", note = "via WebSocket" },
]

